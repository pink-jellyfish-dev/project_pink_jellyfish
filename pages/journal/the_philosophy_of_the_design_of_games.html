                <h1>The Philosophy of the Design of Games</h1>
                <p class="subtitle">Pink Jellyfish - 10/9/26</p>
                <!-- <br>
                <p>I’m sure you love games, I do too. But how do these games work? What is a game made up of? And I don’t mean this in a technical sense, I want to focus on the actual design of the game.</p>
                <p>So today in this article I hope to piece together a sort of framework through which we can understand the design of games, and we can improve it through our research.</p>
                <hr>
                <p><em>So what is a game?</em></p>
                <p>Let's start with a very broad and general definition and go from there. </p>
                <p>When playing games, a big focus I see and feel is to win the game. The whole point of the game seems to be to win, and this is true for many games.</p>
                <p>Most ball sports have a winning team, and a losing team. Or in Super Mario Bros, you win if you defeat Bowser and lose if you run out of lives. And I’m sure you can think of more games which also fit this sort of description because winning and losing is a fundamental part of a game.</p>
                <p>Now in some games, winning or losing may be less obvious than others. For example the most popular game of all time, Minecraft, doesn’t have a clear win/lose state. </p>
                <p>However, winning in that game is accomplishing whatever the player sets their goal to be. The game just simply offers plenty of things for the player to chose from. Losing would look like dying or failing to complete a goal.</p>
                <p>So with that we can conclude:</p>
                <blockquote>
                <p>A game is an activity which leads to a win/lose state.</p>
                </blockquote>
                <hr>
                <p><em>Now let's see if we can break that definition.</em></p>
                <p>First thing I can come up with is that  school would be a game by this definition. You lose if you fail, and you win if you pass. But we never think of school as a game, and I don’t think really many people think of it as fun.</p>
                <p>You could think of chores in the same way. You win if you get them done you win the reward of whatever getting them done is. Like doing the dishes, you now have more clean dishes you can use to eat. And losing would just be not doing them and having to deal with lots of dirty dishes.</p>
                <p>Or you could say fighting in a war is a game. You lose if you die and you win if you win the war. Or work, you win money and if you lose you don't get money.</p>
                <p>The point is, there are lots of things in life that can be win/lose but we don’t find them to be games.</p>
                <p><em>So how do we differentiate between what a game is and isn’t when there is more to it than just win/lose?</em></p>
                <p>Let's examine what these two groups have in common: risk. All the examples I listed earlier have a high risk to life for losing. Like fighting in a war or work. Losing the game significantly hurts you and what you care about. But if you look at ball sports, Mario, or Minecraft, losing those games doesn’t actually hurt you aside from maybe your ego.</p>
                <p>So then in order for our definition to more accurately describe games, we must account for the fact that the game must have a low risk to life. So now our definition is:</p>
                <blockquote>
                <p>A game is an activity which leads to a win/lose state where losing has a low risk to life.</p>
                </blockquote>
                <p><strong>Risk</strong></p>
                <hr>
                <p>Risk is an important factor in games, and I believe it is something we need to discuss more.</p>
                <p>Taking risks is exhilarating and scary, and we crave some excitement from that. But being risky in real life is dangerous, so out of fear we don’t risk as much in real life.</p>
                <p>But in a game with fictional resources and numbers, we’re placed in an environment where we can take risks and get the same euphoria and thrill that we desire without having to suffer the consequences in real life.</p>
                <p>Games employ risk to challenge the player, and to add anticipation and thrill. For example, in a dungeon crawler, you find a really cool weapon  but with limited inventory and weight you have to drop some armor to equip it. With that you are risking more protection in hopes that you can beat your enemy before they can hurt you.</p>
                <p>If you look for it, lots of games revolve around risk. But not all games have risk in them, like a clicker game. You just click a button to get a reward, with no risk. And that makes playing the game a relaxing experience.</p>
                <p>However with risk, it is important to note that the risk must be balanced in a way that does not completely demoralize the player with too much or too little reward or loss.</p>
                <p>So with that I’m seeing a pattern here. Depending on the amount of risk in a game, it creates a more thrilling or relaxed experience for the player. A horror game where your whole play through is at risk is going to be more thrilling than a cozy clicker game.</p>
                <p>So let’s revise that definition again:</p>
                <blockquote>
                <p>A game is an activity which leads to a win/lose state where losing has a low risk to life, but uses fictional risk to affect winning or losing.</p>
                </blockquote>
                <hr>
                <p><em>Lets try to break this definition again.</em></p>
                <p><em>Lets play a game. Whoever wins gets 10 points. Whoever has the most points when they quit wins the whole game. I decide who wins. Ok ready? 3… 2… 1… I win and I quit so I win the whole game!</em></p>
                <p>Was that fun? Probably not. Is that a game? No not really. Why?</p>
                <p>Well, you’re not <em>playing</em> the game. We’ve defined what happens after you play a game and what distinguishes it from just losing or winning in life. But what about the actual meat of the game? The stuff that allows all of our prior discussion and definition to happen?</p>
                <p>Games need rules.</p>
                <p>All games have rules that define how the game works. A clicker game has a rule that when you click a button you get a reward. Chess has rules for each piece and how they move on the board. Minecraft has rules for how the world behaves.</p>
                <p>Rules are the true structure and meat of a game, and where designers spend most of their time tweaking and playing with things to make the game fun. And a rule could really be anything, but generally most games follow this pattern:</p>
                <blockquote>
                <p>A rule is a property of a game that affects risks, rewards, winning, and losing.</p>
                </blockquote>
                <hr>
                <p>Those main components we discussed earlier that make up a game a rule establishes. The trashy game I made earlier I started by defining the rules which were:</p>
                <ul>
                <li>Whoever wins gets 10 points</li>
                <li>Whoever has the most points when they quit wins the game</li>
                <li>I decide who wins</li>
                </ul>
                <p>Those rules state how the game is won or lost, and what you risk (just winning or losing in this case) to win or lose the game. But they aren’t fun in part because the rules have nothing to do with you, there is nothing to play.</p>
                <p>And that is an important property of a rule, they allow a player to do things with the game, to risk things and to gain rewards or losses from those rules.</p>
                <p>So lets revise those rules to make a more fun game:</p>
                <p>Lets flip a coin:</p>
                <ul>
                <li>You call heads or tails<ul>
                <li>If it lands on what you called you win</li>
                <li>If it doesn’t I win</li>
                </ul>
                </li>
                <li>We count up who has the most wins</li>
                <li>Whoever gets to 10 first wins</li>
                </ul>
                <p>Now you’re playing the game, you’re weighing risks and determining the best course of action to get the most points. Now I am 100% sure that this game is way more fun than the garbage game I made up earlier.</p>
                <p>And it is in examining these rules and how they affect risk and winning or losing that we will be spending most of our time researching.</p>
                <p>So to update our definition once again:</p>
                <blockquote>
                <p>A game is an activity which leads to a win/lose state where losing has a low risk to life, but uses fictional risk to affect winning or losing through employing rules to define how the games work.</p>
                </blockquote>
                <p><strong>Systems:</strong></p>
                <hr>
                <p>Now a collection of rules is what makes a system within a game. Here let me show you what I mean:</p>
                <p>Health System:</p>
                <ul>
                <li>Touching a cactus deals 1 damage which subtracts 1 from your health</li>
                <li>Your maximum health is 10</li>
                <li>You can regain 1 health by drinking a health potion if you have that</li>
                <li>If your health drops below zero you die and lose</li>
                </ul>
                <p>Loot System:</p>
                <ul>
                <li>Opening a chest gives you 3-5 gold</li>
                <li>Defeating an enemy gives you 7-10 gold</li>
                </ul>
                <p>Marketplace System:</p>
                <ul>
                <li>You can buy a health potion for 10 gold</li>
                <li>You can buy a better sword that does 10 damage for 50 gold</li>
                </ul>
                <p>Combat System:</p>
                <ul>
                <li>An enemy will attack the player and deal 3 damage if they are close to the player</li>
                <li>The player can attack the enemy with their sword and deal 5 damage</li>
                <li>The player wins when they have defeated all 10 enemies</li>
                </ul>
                <p>Each of these are separate systems that don’t work as a game on their own. However, when working together with enough systems, you get a full complex game. But it is in the interaction between these systems that you can see the whole game come to life. </p>
                <p>For example, the combat system and looting system work together to give the player gold. The looting and marketplace system work together to give the player potions. And the market place system and health system interact to allow the player to heal.</p>
                <p>I’m sure you could find other connections between the rules and systems to see how this game would play out, and we could add or subtract rules and systems in this game and tweak them until we create a fun and exciting game.</p>
                <hr>
                <p>So now that we have this framework for understanding games, we can begin to analyze them, and to see the choices that the designers have made to make the games. And there will be more on that in the future.</p>
                <p>In the meantime if you would like to use this framework to examine games and share your results, DM me on Substack, or in the comments on this article there! And if you have any feedback or things that I missed in this framework I would love to hear your thoughts on that too!</p>
                <p>Anyways, that’s all from me for now. Until next time!</p> -->
